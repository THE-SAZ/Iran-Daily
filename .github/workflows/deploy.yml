# ──────────────────────────────────────────────
# Iran-Daily — Deploy & Refresh
# Author: THE SAZ (https://github.com/THE-SAZ)
# ──────────────────────────────────────────────
#
# Two modes:
#   1. On push → build + deploy via rsync
#   2. On cron  → refresh slow data (every 6h)
#
# Minimal token usage:
#   - No artifacts (direct rsync)
#   - No redundant checkouts
#   - Combined refresh in one job
#

name: Deploy & Refresh

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Data Refresh (cron only) ──────────────────
  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Refresh Data
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-

      - run: composer install --no-progress --no-interaction --prefer-dist
        working-directory: backend

      - name: Refresh slow data
        run: php scripts/refresh.php

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/storage/data/ || true
          git diff --cached --quiet || git commit -m "chore: refresh data [skip ci]"
          git push || true

  # ── Build & Deploy (push only) ────────────────
  deploy:
    if: github.event_name == 'push'
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefer-offline
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      # Deploy via rsync (skip if secrets not set)
      - name: Deploy to server
        if: ${{ secrets.SSH_HOST != '' }}
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.well-known'
          path: ./frontend/dist/
          remote_path: ${{ secrets.REMOTE_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
