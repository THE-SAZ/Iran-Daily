<?xml version="1.0" encoding="UTF-8"?>
<!--
  Iran-Daily — Dark Banner (Alternative)
  Author: THE SAZ (https://github.com/THE-SAZ)
  License: MIT
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Iran-Daily Dark Banner">
  <defs>
    <linearGradient id="bgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="flagD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <linearGradient id="titleGradD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <radialGradient id="glowD" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>

    <filter id="textShadowD" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#4ade80" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bgD)"/>
  <circle cx="640" cy="200" r="400" fill="url(#glowD)"/>

  <!-- نوارهای پرچم -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#flagD)"/>
  <rect x="0" y="394" width="1280" height="6" fill="url(#flagD)"/>

  <!-- لوگو وسط -->
  <g transform="translate(590, 40)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#0a0e27" stroke="#1e2451" stroke-width="1.5"/>
    <rect x="44" y="24" width="6" height="52" rx="3" fill="url(#flagD)"/>
    <path d="M 44 24 Q 72 24 72 50 Q 72 76 44 76" fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round"/>
    <circle cx="66" cy="32" r="4" fill="#4ade80">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- عنوان -->
  <g filter="url(#textShadowD)">
    <text x="640" y="220"
          font-family="Vazirmatn, Segoe UI, sans-serif"
          font-size="84"
          font-weight="800"
          fill="url(#titleGradD)"
          text-anchor="middle"
          letter-spacing="-2">Iran-Daily</text>

    <text x="640" y="265"
          font-family="Vazirmatn, Segoe UI, sans-serif"
          font-size="22"
          font-weight="500"
          fill="#9fa8da"
          text-anchor="middle"
          opacity="0.85">داشبورد زنده کاربران حرفه‌ای ایرانی</text>
  </g>

  <!-- امضا -->
  <text x="640" y="345"
        font-family="Vazirmatn, Segoe UI, sans-serif"
        font-size="14"
        fill="#5c6bc0"
        text-anchor="middle">Crafted with ❤️ by</text>
  <text x="640" y="368"
        font-family="Vazirmatn, Segoe UI, sans-serif"
        font-size="16"
        font-weight="700"
        fill="#4ade80"
        text-anchor="middle">THE SAZ · github.com/THE-SAZ</text>
</svg>
