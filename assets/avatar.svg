<?xml version="1.0" encoding="UTF-8"?>
<!--
  Iran-Daily — Avatar
  Author: THE SAZ (https://github.com/THE-SAZ)
  License: MIT
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#151a3a"/>
    </linearGradient>

    <linearGradient id="avFlag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <linearGradient id="avGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <radialGradient id="avGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>

    <filter id="avShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- پس‌زمینه گرد -->
  <circle cx="256" cy="256" r="248" fill="url(#avBg)" filter="url(#avShadow)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#1e2451" stroke-width="4"/>
  <circle cx="256" cy="256" r="220" fill="url(#avGlow)"/>

  <!-- حلقه پرچم -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#avFlag)"
          stroke-width="6" stroke-dasharray="0 1382" stroke-dashoffset="0">
    <!-- کمان‌های سه‌گانه پرچم -->
  </circle>

  <!-- کمان سبز (بالا) -->
  <path d="M 256 36 A 220 220 0 0 1 446 256"
        fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
  <!-- کمان سفید (کناره) -->
  <path d="M 446 256 A 220 220 0 0 1 256 476"
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <!-- کمان سرخ (پایین) -->
  <path d="M 256 476 A 220 220 0 0 1 66 256"
        fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>

  <!-- حرف I -->
  <rect x="242" y="150" width="24" height="200" rx="12" fill="url(#avFlag)"/>

  <!-- قوس D -->
  <path d="M 242 150 Q 342 150 342 250 Q 342 350 242 350"
        fill="none" stroke="#4ade80" stroke-width="22" stroke-linecap="round"/>

  <!-- نقطه Live -->
  <circle cx="326" cy="176" r="18" fill="#4ade80">
    <animate attributeName="r" values="18;24;18" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="326" cy="176" r="18" fill="none" stroke="#4ade80" stroke-width="3">
    <animate attributeName="r" values="18;44;18" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- نقطه تزئینی طلایی -->
  <circle cx="386" cy="250" r="6" fill="url(#avGold)" opacity="0.9"/>

  <!-- نشان کوچک "THE SAZ" -->
  <text x="256" y="446"
        font-family="Vazirmatn, sans-serif"
        font-size="20" font-weight="800"
        fill="url(#avGold)"
        text-anchor="middle"
        letter-spacing="2">THE SAZ</text>
</svg>
